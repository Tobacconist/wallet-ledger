services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet_dev}
    ports:
      - "5432:5432"
    volumes:
      - wallet-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Wallet.Api/Dockerfile
    environment:
      ConnectionStrings__Wallet: Host=db;Port=5432;Database=wallet;Username=wallet;Password=${POSTGRES_PASSWORD:-wallet_dev};GSS Encryption Mode=Disable
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  wallet-db:
